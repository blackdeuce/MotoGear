
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGear | Accessories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #101010;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            background: #181818;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #ff4d00;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff4d00;
        }

        .hero {
            padding: 75px 8%;
            text-align: center;
            background: linear-gradient(120deg, #252525, #111);
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #ff4d00;
        }

        .hero p {
            color: #bbb;
            font-size: 17px;
        }

        .products {
            padding: 55px 8%;
        }

        .products h2 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-7px);
            border-color: #ff4d00;
        }

        .product-image {
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 75px;
            background: #292929;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .product h3 {
            margin-bottom: 12px;
        }

        .price {
            color: #ff4d00;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .product button {
            background: #ff4d00;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .product button:hover {
            background: #d93f00;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #181818;
            color: #999;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MotoGear.</div>

        <nav>
            <a href="accessories.html">Home</a>
            <a href="#products">Accessories</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <section class="hero">
        <h1>WELCOME TO <span>MOTOGEAR</span></h1>
        <p>Your ride. Your style. Your accessories.</p>
    </section>

    <section class="products" id="products">

        <h2>Explore Motorcycle Accessories</h2>

        <div class="product-grid">

            <div class="product">
                <div class="product-image">🏍️</div>
                <h3>Riding Helmet</h3>
                <p class="price">₹2,499</p>
                <button onclick="addToCart('Riding Helmet')">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">🧤</div>
                <h3>Riding Gloves</h3>
                <p class="price">₹899</p>
                <button onclick="addToCart('Riding Gloves')">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">🧥</div>
                <h3>Riding Jacket</h3>
                <p class="price">₹3,999</p>
                <button onclick="addToCart('Riding Jacket')">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">🕶️</div>
                <h3>Riding Goggles</h3>
                <p class="price">₹599</p>
                <button onclick="addToCart('Riding Goggles')">
                    Add to Cart
                </button>
            </div>

        </div>
    </section>

    <footer>
        © 2026 MotoGear. All Rights Reserved.
    </footer>

    <script>
        // Simple demo cart interaction
        function addToCart(product) {
            alert(product + " added to your cart!");
        }

        // Logout
        document.getElementById("logoutBtn").addEventListener("click", function(event) {
            event.preventDefault();

            sessionStorage.removeItem("motogear_token");

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
